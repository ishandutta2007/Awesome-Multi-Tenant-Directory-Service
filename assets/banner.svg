<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.8;transform:scale(1.08)}}@keyframes float-1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(3deg)}}@keyframes float-2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-3deg)}}.bg-animate{fill:url(#bg-grad)}.pulse-node{animation:pulse 4s ease-in-out infinite;transform-origin:center}.float-node-1{animation:float-1 6s ease-in-out infinite}.float-node-2{animation:float-2 7s ease-in-out infinite}.connecting-line{stroke:#6366f1;stroke-opacity:.35;stroke-width:1.5;stroke-dasharray:6 6;animation:dash 8s linear infinite}.accent-title{font-weight:800;fill:url(#text-grad)}.accent-title,.badge-text,.subtitle{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:400;fill:#94a3b8}.badge-text{font-weight:600;fill:#e2e8f0;font-size:13px}</style><rect width="1200" height="360" class="bg-animate" rx="16"/><g opacity=".6"><line x1="150" x2="300" y1="90" y2="160" class="connecting-line"/><line x1="300" x2="180" y1="16