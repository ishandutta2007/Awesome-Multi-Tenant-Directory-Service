<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.08); }
    }
    @keyframes float-1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes float-2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-3deg); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .bg-animate { fill: url(#bg-grad); }
    .pulse-node { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    .float-node-1 { animation: float-1 6s ease-in-out infinite; }
    .float-node-2 { animation: float-2 7s ease-in-out infinite; }
    .connecting-line { stroke: #6366f1; stroke-opacity: 0.35; stroke-width: 1.5; stroke-dasharray: 6 6; animation: dash 8s linear infinite; }
    .accent-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: url(#text-grad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; fill: #e2e8f0; font-size: 13px; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" class="bg-animate"/>

  <!-- Background Dynamic Network Nodes & Tenant Isolation Bubbles -->
  <g opacity="0.6">
    <!-- Connecting network mesh -->
    <line x1="150" y1="90" x2="300" y2="160" class="connecting-line"/>
    <line x1="300" y1="160" x2="180" y2="270" class="connecting-line"/>
    <line x1="1050" y1="80" x2="920" y2="180" class="connecting-line"/>
    <line x1="920" y1="180" x2="1020" y2="290" class="connecting-line"/>

    <!-- Floating Tenant Nodes (Background) -->
    <g class="float-node-1">
      <circle cx="150" cy="90" r="35" fill="#38bdf8" opacity="0.15" class="pulse-node"/>
      <circle cx="150" cy="90" r="18" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="150" y="94" text-anchor="middle" class="badge-text" fill="#38bdf8">Tenant A</text>
    </g>

    <g class="float-node-2">
      <circle cx="180" cy="270" r="40" fill="#818cf8" opacity="0.15" class="pulse-node"/>
      <circle cx="180" cy="270" r="22" fill="none" stroke="#818cf8" stroke-width="2"/>
      <text x="180" y="274" text-anchor="middle" class="badge-text" fill="#818cf8">Tenant B</text>
    </g>

    <g class="float-node-2">
      <circle cx="1050" cy="80" r="38" fill="#c084fc" opacity="0.15" class="pulse-node"/>
      <circle cx="1050" cy="80" r="20" fill="none" stroke="#c084fc" stroke-width="2"/>
      <text x="1050" y="84" text-anchor="middle" class="badge-text" fill="#c084fc">Tenant C</text>
    </g>

    <g class="float-node-1">
      <circle cx="1020" cy="290" r="42" fill="#34d399" opacity="0.15" class="pulse-node"/>
      <circle cx="1020" cy="290" r="22" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="1020" y="294" text-anchor="middle" class="badge-text" fill="#34d399">Tenant D</text>
    </g>
  </g>

  <!-- Foreground Glassmorphism Banner Frame -->
  <rect x="220" y="45" width="760" height="270" rx="16" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Foreground Typography & Branding (Always Clear & Top Layer) -->
  <!-- Top Category Label -->
  <rect x="470" y="70" width="260" height="30" rx="15" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-opacity="0.4"/>
  <text x="600" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">ENTERPRISE IAM &amp; DIRECTORY</text>

  <!-- Title -->
  <text x="600" y="150" text-anchor="middle" class="accent-title" font-size="34" letter-spacing="-0.5" filter="url(#glow)">Awesome Multi-Tenant Directory Service</text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" class="subtitle" font-size="16">Curated Ecosystem of SaaS Platforms, Open-Source Directories &amp; Tenant Isolation Frameworks</text>

  <!-- Feature Pill Tags -->
  <g transform="translate(325, 235)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
    <text x="80" y="21" text-anchor="middle" class="badge-text" fill="#7dd3fc">🔐 Identity Stores</text>

    <!-- Pill 2 -->
    <rect x="190" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1"/>
    <text x="275" y="21" text-anchor="middle" class="badge-text" fill="#a5b4fc">🏢 Multi-Tenancy</text>

    <!-- Pill 3 -->
    <rect x="380" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1"/>
    <text x="465" y="21" text-anchor="middle" class="badge-text" fill="#e9d5ff">🌐 Self-Hosted LDAP</text>
  </g>
</svg>
